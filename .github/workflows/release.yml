name: Build and Release AlterEgo Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.8,<7" "pyinstaller>=6.12,<7"

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean "AlterEgo Desktop.spec"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlterEgo-Desktop-Windows
          path: dist/AlterEgo Desktop.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AlterEgo Desktop.exe
          generate_release_notes: true
